<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07113a">
<title>DELTA'Soft — Développement logiciel, techniques appliquées</title>
<meta name="description" content="DELTA'Soft — Développement logiciel, techniques appliquées.">
<style>
  :root{
    --bg-0:#060a1e;
    --bg-1:#09174e;
    --bg-2:#112789;
    --ink:#f8fbff;
    --muted:#b8c4ef;
    --blue:#315aff;
    --blue-2:#82adff;
    --line:rgba(255,255,255,.12);
    --line-soft:rgba(255,255,255,.075);
    --glass:rgba(9,17,54,.58);
  }

  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}

  body{
    min-height:100vh;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 18% 18%, rgba(47,88,255,.20), transparent 28rem),
      radial-gradient(circle at 83% 79%, rgba(62,108,255,.14), transparent 30rem),
      linear-gradient(145deg,var(--bg-0) 0%,var(--bg-1) 52%,#070c25 100%);
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
      linear-gradient(var(--line-soft) 1px,transparent 1px),
      linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:linear-gradient(to bottom,rgba(0,0,0,.78),transparent 94%);
  }

  .page{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:clamp(18px,4vw,52px);
  }

  .card{
    position:relative;
    width:min(1180px,100%);
    min-height:min(720px,calc(100vh - 72px));
    display:grid;
    grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:34px;
    background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.038));
    box-shadow:0 30px 100px rgba(0,0,0,.44);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
  }

  .card::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:linear-gradient(135deg,rgba(255,255,255,.16),transparent 22%,transparent 72%,rgba(56,93,255,.16));
  }

  .visual,.content{position:relative;z-index:1}

  .visual{
    min-height:620px;
    display:grid;
    place-items:center;
    padding:clamp(32px,5vw,70px);
    border-right:1px solid var(--line);
    background:
      radial-gradient(circle at 50% 46%,rgba(72,109,255,.215),transparent 16rem),
      linear-gradient(180deg,rgba(255,255,255,.030),rgba(255,255,255,.010));
  }

  .visual::before,.visual::after{
    content:"";
    position:absolute;
    width:15px;
    height:15px;
    opacity:.72;
  }
  .visual::before{top:24px;left:24px;border-left:1px solid rgba(255,255,255,.28);border-top:1px solid rgba(255,255,255,.28)}
  .visual::after{right:24px;bottom:24px;border-right:1px solid rgba(255,255,255,.28);border-bottom:1px solid rgba(255,255,255,.28)}

  .tech-field{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
  }

  .tech-chip{
    position:absolute;
    width:54px;
    height:54px;
    display:grid;
    place-items:center;
    border:1px solid rgba(148,177,255,.16);
    background:rgba(29,45,110,.08);
    color:rgba(220,230,255,.52);
    border-radius:16px;
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
    box-shadow:0 0 0 1px rgba(255,255,255,.02) inset;
  }

  .tech-chip svg{
    width:28px;
    height:28px;
    display:block;
  }

  .tech-chip.qr svg{width:26px;height:26px}
  .tech-chip.wide svg{width:30px;height:30px}

  .t1{top:11%;left:10%}
  .t2{top:17%;left:66%}
  .t3{top:28%;left:17%}
  .t4{top:27%;left:72%}
  .t5{top:42%;left:74%}
  .t6{top:52%;left:8%}
  .t7{top:61%;left:70%}
  .t8{top:69%;left:15%}
  .t9{top:77%;left:61%}
  .t10{top:83%;left:28%}

  .logo-scene{
    position:relative;
    width:min(340px,70%);
    aspect-ratio:1;
    display:grid;
    place-items:center;
    perspective:1100px;
    z-index:2;
  }

  .logo-scene::before{
    content:"";
    position:absolute;
    inset:22%;
    border-radius:50%;
    border:1px solid rgba(115,153,255,.10);
    box-shadow:0 0 0 30px rgba(93,132,255,.02),0 0 0 64px rgba(93,132,255,.01);
  }

  .logo-scene::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:14%;
    width:48%;
    height:8%;
    transform:translateX(-50%);
    border-radius:50%;
    background:radial-gradient(ellipse,rgba(0,0,0,.44),transparent 70%);
    filter:blur(10px);
  }

  .delta-mark{
    position:relative;
    z-index:1;
    width:100%;
    height:100%;
    display:block;
    transform-origin:50% 50%;
    transform-box:fill-box;
    transform-style:preserve-3d;
    will-change:transform;
    filter:drop-shadow(0 22px 28px rgba(0,0,0,.28));
  }

  .content{
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:clamp(40px,6vw,82px);
  }

  .wordmark{
    margin:0;
    white-space:nowrap;
    line-height:.95;
    letter-spacing:-.055em;
    font-size:clamp(2.85rem,6vw,5.8rem);
    font-weight:850;
  }

  .delta-word{color:#1228ff;text-shadow:0 0 18px rgba(33,63,255,.18)}
  .soft-word{margin-left:.06em;font-weight:580;font-style:italic;color:#090b12;text-shadow:0 0 1px rgba(255,255,255,.28),0 0 10px rgba(0,0,0,.18)}

  .brand-line{
    width:clamp(300px,34vw,392px);
    height:5px;
    margin:21px 0 30px;
    display:flex;
    align-items:center;
    gap:4px;
  }

  .brand-line-blue,.brand-line-black{
    display:block;
    height:100%;
    border-radius:99px;
  }
  .brand-line-blue{
    width:63%;
    background:#1230ff;
    box-shadow:0 0 18px rgba(37,71,255,.28);
  }
  .brand-line-black{
    width:37%;
    background:#0a0a10;
    box-shadow:0 0 1px rgba(255,255,255,.20);
  }

  .tagline{
    margin:0;
    max-width:none;
    color:var(--muted);
    font-size:clamp(.68rem,2.6vw,1.12rem);
    line-height:1.35;
    letter-spacing:0;
    white-space:nowrap;
  }
  .tagline strong{color:#f7f9ff;font-weight:700}

  .contact{
    margin-top:42px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:12px 26px;
    font-size:.96rem;
  }

  .contact a{
    color:#dfe7ff;
    text-decoration:none;
    border-bottom:1px solid rgba(156,184,255,.32);
    padding-bottom:3px;
    transition:color .2s ease,border-color .2s ease;
  }
  .contact a:hover,.contact a:focus-visible{color:#fff;border-color:#86a9ff}
  .contact a:focus-visible{outline:2px solid #a9beff;outline-offset:5px}

  .contact .sep{width:3px;height:3px;border-radius:50%;background:#7185c8;opacity:.9}

  .meta{
    margin-top:auto;
    padding-top:52px;
    color:#7685b8;
    font-size:.74rem;
    letter-spacing:.035em;
  }
  .meta strong{color:#9aa9dc;font-weight:650}

  @media (max-width:900px){
    .page{padding:18px}
    .card{min-height:auto;grid-template-columns:1fr;border-radius:26px}
    .visual{min-height:380px;border-right:0;border-bottom:1px solid var(--line);padding:30px}
    .logo-scene{width:min(265px,62vw)}
    .content{padding:38px 30px 34px}
    .wordmark{font-size:clamp(2.8rem,12vw,5.8rem)}
    .tech-chip{width:50px;height:50px}
    .tech-chip{width:50px;height:50px}
    .tech-chip svg{width:25px;height:25px}
    .meta{padding-top:40px}
  }

  @media (max-width:560px){
    .page{padding:0}
    .card{min-height:100vh;border-radius:0;border-left:0;border-right:0}
    .visual{min-height:320px;padding:20px 14px}
    .logo-scene{width:min(220px,60vw)}
    .content{padding:32px 22px 28px}
    .wordmark{font-size:clamp(2.55rem,13.4vw,4.2rem)}
    .brand-line{margin-top:17px;margin-bottom:25px;width:clamp(260px,78vw,392px)}
    .tagline{font-size:clamp(.68rem,2.9vw,.98rem);white-space:nowrap}
    .contact{margin-top:34px;gap:10px 18px;font-size:.9rem}
    .tech-chip{width:44px;height:44px;border-radius:14px}
    .tech-chip svg{width:22px;height:22px}
    .meta{padding-top:42px}
    .tech-chip{width:44px;height:44px;border-radius:14px}
  }

  @media (max-width:390px){
    .wordmark{font-size:clamp(2.3rem,12.7vw,3.2rem)}
    .contact .sep{display:none}
    .contact{align-items:flex-start;flex-direction:column}
  }
</style>
</head>

<script>
(function(){
  const mark = document.getElementById('deltaMark');
  const scene = document.getElementById('logoScene');
  const visual = document.querySelector('.visual');
  if (!mark || !scene || !visual) return;

  // V3.11
  // Déplacement total : environ 300 px (-150 à +150).
  // Inclinaison volontairement plus visible que dans la V3.10.
  const maxMoveX = 150;
  const maxMoveY = 150;
  const maxTiltX = 22;
  const maxTiltY = 26;

  let targetMoveX = 0, targetMoveY = 0;
  let currentMoveX = 0, currentMoveY = 0;
  let targetTiltX = 0, targetTiltY = 0;
  let currentTiltX = 0, currentTiltY = 0;

  function setTarget(clientX, clientY){
    const r = visual.getBoundingClientRect();
    const centerX = r.left + r.width / 2;
    const centerY = r.top + r.height / 2;

    // Normalisation sur la zone graphique elle-même, et non sur toute
    // la fenêtre : l'inclinaison devient nettement perceptible.
    const nx = Math.max(-1, Math.min(1,
      (clientX - centerX) / Math.max(1, r.width / 2)
    ));
    const ny = Math.max(-1, Math.min(1,
      (clientY - centerY) / Math.max(1, r.height / 2)
    ));

    targetMoveX = nx * maxMoveX;
    targetMoveY = ny * maxMoveY;

    // La pointe se penche vers la souris.
    targetTiltY = nx * maxTiltY;
    targetTiltX = -ny * maxTiltX;
  }

  function render(){
    // Translation souple.
    currentMoveX += (targetMoveX - currentMoveX) * 0.075;
    currentMoveY += (targetMoveY - currentMoveY) * 0.075;

    // Orientation un peu plus réactive.
    currentTiltX += (targetTiltX - currentTiltX) * 0.14;
    currentTiltY += (targetTiltY - currentTiltY) * 0.14;

    // Le déplacement concerne la scène.
    scene.style.transform =
      'translate3d(' + currentMoveX.toFixed(1) + 'px,' +
      currentMoveY.toFixed(1) + 'px,0)';

    // L'inclinaison concerne directement l'aile.
    // Perspective courte = volume nettement perceptible sans rotation Z.
    mark.style.transform =
      'perspective(520px) ' +
      'rotateX(' + currentTiltX.toFixed(2) + 'deg) ' +
      'rotateY(' + currentTiltY.toFixed(2) + 'deg) ' +
      'translateZ(18px) scale(1.015)';

    requestAnimationFrame(render);
  }

  document.addEventListener('mousemove', function(e){
    setTarget(e.clientX, e.clientY);
  }, {passive:true});

  document.addEventListener('mouseleave', function(){
    targetMoveX = 0;
    targetMoveY = 0;
    targetTiltX = 0;
    targetTiltY = 0;
  });

  render();
})();
</script>
</body>
